[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-literature-brief"
version = "1.0.0"
description = "Weekly bioengineering literature briefs with OpenAI or Anthropic"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
literature-brief = "literature_brief.__main__:main"

[tool.setuptools.packages.find]
include = ["literature_brief*"]
