name: Check OpenAI API access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check API access without exposing credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("OPENAI_API_KEY", "").strip()
          if not key:
              print("API_ACCESS_CHECK: missing_repository_secret")
              sys.exit(1)

          payload = {
              "model": "gpt-4.1-mini",
              "messages": [{"role": "user", "content": "Reply OK."}],
              "max_completion_tokens": 1
          }
          request = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  print("API_ACCESS_CHECK: " + json.dumps({"http_status": response.status, "result": "success"}))
          except urllib.error.HTTPError as exc:
              try:
                  body = json.loads(exc.read(16384))
                  error = body.get("error", {})
                  if not isinstance(error, dict):
                      error = {}
              except Exception:
                  error = {}
              def safe_code(value):
                  return value if isinstance(value, str) and re.fullmatch(r"[a-z_]{1,100}", value) else "unavailable"
              print("API_ACCESS_CHECK: " + json.dumps({
                  "http_status": exc.code,
                  "error_type": safe_code(error.get("type")),
                  "error_code": safe_code(error.get("code")),
              }))
              sys.exit(1)
          except (urllib.error.URLError, TimeoutError, OSError):
              print("API_ACCESS_CHECK: network_error")
              sys.exit(1)
          PY
