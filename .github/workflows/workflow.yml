name: Weekly literature brief

on:
  schedule:
    - cron: "0 7 * * 1" # Monday at 07:00 UTC (independent of daylight saving time).
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: literature-brief-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  build:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore validated LLM assessments
        uses: actions/cache/restore@v6
        with:
          path: .cache/scores
          key: literature-scores-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: literature-scores-${{ runner.os }}-
      - name: Fetch papers and build the brief
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          BRIEF_MODE: ${{ vars.BRIEF_MODE || 'fetch-only' }}
        run: |
          case "$BRIEF_MODE" in
            fetch-only) python -m literature_brief --fetch-only --output site ;;
            ai) python -m literature_brief --output site ;;
            *) echo "BRIEF_MODE must be fetch-only or ai." >&2; exit 1 ;;
          esac
      - name: Save assessments even if a later paper failed
        if: always() && steps.generate.outcome != 'skipped' && hashFiles('.cache/scores/*.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .cache/scores
          key: literature-scores-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Optional: emails the top picks once the new edition is live. It is skipped
  # successfully until the SMTP secrets and EMAIL_TO variable are configured.
  email:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Email the weekly picks
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python -m literature_brief.mailer --brief "${PAGE_URL%/}/brief.json" --site-url "$PAGE_URL"
